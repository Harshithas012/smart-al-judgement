<!DOCTYPE html>
<html>
<head>
    <title>Smart AI Judgement</title>

    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .p {
            background-color: beige;
            font-size: 34px;
            border-color: black;
            border-width: 10px;
            border-style: solid;
            padding: 10px;
        }

        .u {
            width: 750px;
            height: 150px;
            margin-left: 400px;
            margin-top: 80px;
            border-color: black;
            border-width: 5px;
            border-style: solid;
            font-size: 20px;
            padding: 10px;
        }

        .search {
            margin-left: 400px;
            margin-top: 20px;
            font-size: 20px;
            padding: 10px 25px;
            cursor: pointer;
        }

        #results {
            width: 750px;
            margin-left: 400px;
            margin-top: 30px;
        }

        .result-card {
            border: 2px solid black;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #f5f5f5;
        }

        .result-card h2 {
            color: darkblue;
        }
    </style>
</head>

<body>

    <center>
        <button class="p">SMART AI JUDGEMENT</button>
    </center>

    <br>

    <textarea
        class="u"
        id="query"
        placeholder="Enter your case description here..."
    ></textarea>

    <br>

    <button class="search" onclick="searchCase()">
        SEARCH CASE
    </button>

    <div id="results"></div>


    <script>
        async function searchCase() {

            const query = document.getElementById("query").value.trim();

            const resultsBox = document.getElementById("results");

            if (query === "") {
                resultsBox.innerHTML = "<p>Please enter a case description.</p>";
                return;
            }

            try {

                const response = await fetch(
                    "/search?query=" + encodeURIComponent(query)
                );

                const results = await response.json();

                resultsBox.innerHTML = "";

                if (results.length === 0) {
                    resultsBox.innerHTML =
                        "<p>No matching legal case found.</p>";
                    return;
                }

                results.forEach(item => {

                    let evidence = "";

                    if (item.evidence) {
                        item.evidence.forEach(e => {
                            evidence += "<li>" + e + "</li>";
                        });
                    }

                    resultsBox.innerHTML += `
                        <div class="result-card">

                            <h2>
                                Possible Case: ${item.case}
                            </h2>

                            <p>
                                <strong>Offence Section:</strong>
                                ${item.offenceSection}
                            </p>

                            <p>
                                <strong>Punishment Section:</strong>
                                ${item.punishmentSection}
                            </p>

                            <p>
                                <strong>Punishment:</strong>
                                ${item.punishment}
                            </p>

                            <p>
                                <strong>Classification:</strong>
                                ${item.classification}
                            </p>

                            <p>
                                <strong>Court:</strong>
                                ${item.court}
                            </p>

                            <p>
                                <strong>Evidence:</strong>
                            </p>

                            <ul>
                                ${evidence}
                            </ul>

                            <p>
                                <strong>Explanation:</strong>
                                ${item.explanation}
                            </p>

                        </div>
                    `;
                });

            } catch (error) {

                resultsBox.innerHTML =
                    "<p>Error connecting to the Python backend.</p>";

                console.error(error);
            }
        }
    </script>

</body>
</html>
